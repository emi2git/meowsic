name: Meowsic
options:
  bundleIdPrefix: com.meowsic
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "2XWQ4Z988K"  # Apple ID team (emi2git@gmail.com)
    TARGETED_DEVICE_FAMILY: "1,2"   # universal: iPhone + iPad (iPad-optimized)
schemes:
  Meowsic:
    build:
      targets:
        Meowsic: all
        MeowsicUITests: [test]
    test:
      targets: [MeowsicUITests]
targets:
  # Presses every control on throwaway data (see Sources/App/UITestSupport.swift).
  MeowsicUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources: [UITests]
    dependencies:
      - target: Meowsic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.meowsic.uitests
        SUPPORTS_MACCATALYST: YES
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        "CODE_SIGN_STYLE[sdk=macosx*]": Manual
        "DEVELOPMENT_TEAM[sdk=macosx*]": ""
  Meowsic:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Meowsic
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        # "Open with Meowsic" for Emi Music Note's output (Finder, Files, AirDrop).
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Score
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.recordare.musicxml.uncompressed
              - public.midi-audio
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.recordare.musicxml.uncompressed
            UTTypeDescription: MusicXML score
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [musicxml]
        NSPhotoLibraryUsageDescription: "Meowsic reads your photo library to find and organize your sheet music."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meowsic.app
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Mac build (Mac Catalyst, iPad look): runs locally, ad-hoc signed.
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        "CODE_SIGN_STYLE[sdk=macosx*]": Manual
        "DEVELOPMENT_TEAM[sdk=macosx*]": ""
        "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": ""
