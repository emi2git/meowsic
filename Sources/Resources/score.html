<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; background: #fff; -webkit-user-select: none; }
  #score { padding: 8px 4px 56px; }
  #err { font: 15px -apple-system, sans-serif; color: #b00020; padding: 24px; }
</style>
<script src="osmd.min.js"></script>
</head>
<body>
<div id="score"></div>
<script>
// Notation: OpenSheetMusicDisplay, with the same engraving settings Emi Music Note uses.
let osmd;

async function show(xml, zoom, midiBase64, transpose) {
  try {
    osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("score", {
      autoResize: false, backend: "svg", drawTitle: true, drawSubtitle: false, drawComposer: false,
      drawPartNames: false, drawPartAbbreviations: false,
      drawMeasureNumbersOnlyAtSystemStart: true, newSystemFromXML: false, followCursor: false });
    const r = osmd.EngravingRules;
    r.MinNoteDistance = 2.0; r.VoiceSpacingMultiplierVexflow = 0.7; r.VoiceSpacingAddendVexflow = 2.2;
    r.BetweenSyllableMinimumDistance = 1.0; r.LyricsHeight = 1.8;
    r.LyricOverlapAllowedIntoNextMeasure = 0.4; r.ChordSymbolXSpacing = 1.5;
    await osmd.load(xml);
    osmd.zoom = zoom;
    osmd.TransposeCalculator = new opensheetmusicdisplay.TransposeCalculator();
    if (transpose) { player.shift = transpose; osmd.Sheet.Transpose = transpose; osmd.updateGraphic(); }
    osmd.render();
  } catch (e) {
    document.getElementById("score").innerHTML = '<div id="err">Could not draw this score: ' + String(e).replace(/</g, "&lt;") + '</div>';
    return { ok: false, error: String(e) };
  }
  let notes = 0;
  if (midiBase64) {
    try {
      player.load(parseMidi(bytesOf(midiBase64)));
      notes = player.notes.length;
      follow.measure();
    } catch (e) { notes = 0; }
  }
  return { ok: true, measures: osmd.GraphicSheet.MeasureList.length, notes: notes, stops: follow.stops.length };
}

function bytesOf(base64) {
  const bin = atob(base64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function redraw() { if (osmd) { osmd.render(); follow.measure(); follow.place(player.now(), false); } }
// Move the whole score (notes, key signature, chord names) and its playback by `semitones`.
function setTranspose(semitones) {
  player.shift = semitones;
  if (!osmd) return;
  osmd.Sheet.Transpose = semitones;
  osmd.updateGraphic();
  redraw();
}
function setZoom(zoom) { if (osmd) { osmd.zoom = zoom; redraw(); } }
let resizeTimer = 0, lastWidth = innerWidth;
addEventListener("resize", () => {
  if (innerWidth === lastWidth) return;          // height-only changes don't reflow the music
  lastWidth = innerWidth;
  clearTimeout(resizeTimer); resizeTimer = setTimeout(redraw, 250);
});

// Standard MIDI file -> notes [{t: start seconds, d: seconds, n: MIDI note, v: velocity}] sorted by
// start, plus quarterAt(seconds): the musical position (in quarter notes) the file is at by then.
function parseMidi(u8) {
  let p = 0;
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const tag = () => { const s = String.fromCharCode(u8[p], u8[p + 1], u8[p + 2], u8[p + 3]); p += 4; return s; };
  const u32 = () => { const v = dv.getUint32(p); p += 4; return v; };
  const varlen = () => { let v = 0, b; do { b = u8[p++]; v = (v << 7) | (b & 127); } while (b & 128); return v; };
  if (tag() !== "MThd") throw new Error("not a MIDI file");
  const headerLen = u32(), div = dv.getUint16(p + 4);
  if (div & 0x8000) throw new Error("SMPTE-timed MIDI is not supported");
  p += headerLen;
  const tempos = [], raw = [];
  while (p + 8 <= u8.length) {
    const kind = tag(), end = p + 4 + dv.getUint32(p); p += 4;
    if (kind === "MTrk") {
      let tick = 0, status = 0;
      const on = new Map();
      while (p < end) {
        tick += varlen();
        let s = u8[p];
        if (s & 128) { p++; if (s < 0xF0) status = s; } else s = status;
        if (s === 0xFF) {
          const type = u8[p++], len = varlen();
          if (type === 0x51) tempos.push({ tick: tick, us: (u8[p] << 16) | (u8[p + 1] << 8) | u8[p + 2] });
          p += len;
        } else if (s === 0xF0 || s === 0xF7) {
          p += varlen();
        } else {
          const hi = s & 0xF0, ch = s & 15, a = u8[p++], b = (hi === 0xC0 || hi === 0xD0) ? 0 : u8[p++];
          const key = ch * 128 + a;
          const off = () => { const o = on.get(key); if (o) { raw.push({ a: o.tick, b: tick, n: a, v: o.v }); on.delete(key); } };
          if (hi === 0x90 && b > 0) { off(); if (ch !== 9) on.set(key, { tick: tick, v: b }); }
          else if (hi === 0x80 || hi === 0x90) off();
        }
      }
    }
    p = end;
  }
  tempos.sort((x, y) => x.tick - y.tick);
  const seg = [{ tick: 0, us: 500000, sec: 0 }];
  for (const t of tempos) {
    const l = seg[seg.length - 1];
    if (t.tick === l.tick) l.us = t.us;
    else seg.push({ tick: t.tick, us: t.us, sec: l.sec + (t.tick - l.tick) * l.us / div / 1e6 });
  }
  const last = (field, value) => {               // last tempo segment starting at or before value
    let lo = 0, hi = seg.length - 1;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (seg[m][field] <= value) lo = m; else hi = m - 1; }
    return seg[lo];
  };
  const sec = tick => { const s = last("tick", tick); return s.sec + (tick - s.tick) * s.us / div / 1e6; };
  const quarterAt = t => { const s = last("sec", t); return (s.tick + (t - s.sec) * 1e6 * div / s.us) / div; };
  const notes = raw.map(r => ({ t: sec(r.a), d: Math.max(0.05, sec(r.b) - sec(r.a)), n: r.n, v: r.v }))
                   .sort((x, y) => x.t - y.t);
  return { notes: notes, quarterAt: quarterAt };
}

// Playback on Web Audio. Voice: sampled grand piano (one recording every three semitones, the
// nearest one pitch-shifted); until the samples are in, a plain synth stands in.
const player = {
  ctx: null, out: null, wave: null, piano: [], loading: null, shift: 0,
  notes: [], quarterAt: null, dur: 0, pos: 0, idx: 0, t0: 0, timer: null, playing: false,
  load(midi) {
    this.notes = midi.notes; this.quarterAt = midi.quarterAt;
    this.dur = this.notes.reduce((m, n) => Math.max(m, n.t + n.d), 0); this.pos = 0;
  },
  audio() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const amps = [0, 1, 0.45, 0.22, 0.12, 0.06, 0.03, 0.015];
      this.wave = this.ctx.createPeriodicWave(new Float32Array(amps.length), new Float32Array(amps));
    }
    return this.ctx;
  },
  // samples: { "<MIDI note>": base64 audio file }
  loadPiano(samples) {
    const ctx = this.audio();
    this.loading = Promise.all(Object.entries(samples).map(([note, b64]) =>
      new Promise(done => ctx.decodeAudioData(bytesOf(b64).buffer,
        buf => done({ note: Number(note), buf: buf }), () => done(null)))
    )).then(list => {
      this.piano = list.filter(Boolean).sort((a, b) => a.note - b.note);
      this.loading = null;
      return this.piano.length;
    });
    return this.loading;
  },
  tell() { try { window.webkit.messageHandlers.score.postMessage({ playing: this.playing }); } catch (e) {} },
  now() { return this.playing ? Math.max(0, this.ctx.currentTime - this.t0) : this.pos; },
  async play() {
    if (this.playing || !this.notes.length) return this.state();
    const ctx = this.audio();
    ctx.resume();
    if (this.loading) await this.loading;
    if (this.playing) return this.state();
    if (this.pos >= this.dur) this.pos = 0;
    this.out = ctx.createGain(); this.out.gain.value = 0.8;
    const squash = ctx.createDynamicsCompressor();
    this.out.connect(squash); squash.connect(ctx.destination);
    this.t0 = ctx.currentTime + 0.15 - this.pos;
    this.idx = this.notes.findIndex(n => n.t >= this.pos); if (this.idx < 0) this.idx = this.notes.length;
    this.playing = true;
    this.timer = setInterval(() => this.pump(), 60);
    this.pump(); this.tell(); follow.start();
    return this.state();
  },
  pump() {
    const now = this.ctx.currentTime, horizon = now + 0.4;
    while (this.idx < this.notes.length && this.t0 + this.notes[this.idx].t < horizon) {
      const n = this.notes[this.idx++];
      this.voice(n, Math.max(now, this.t0 + n.t));
    }
    if (now - this.t0 > this.dur + 1.2) { this.pause(); this.pos = 0; follow.hide(); }
  },
  voice(n, when) {
    const env = this.ctx.createGain(), held = Math.max(n.d, 0.08), pitch = n.n + this.shift;
    let src, tail;
    if (this.piano.length) {
      const s = this.piano.reduce((best, x) => Math.abs(x.note - pitch) < Math.abs(best.note - pitch) ? x : best);
      src = this.ctx.createBufferSource();
      src.buffer = s.buf;
      src.playbackRate.value = Math.pow(2, (pitch - s.note) / 12);
      env.gain.setValueAtTime(Math.pow(n.v / 127, 1.2), when);
      env.gain.setTargetAtTime(0, when + held, 0.12);                 // damper falls on release
      tail = 0.8;
    } else {
      src = this.ctx.createOscillator();
      src.setPeriodicWave(this.wave);
      src.frequency.value = 440 * Math.pow(2, (pitch - 69) / 12);
      const ring = 0.35 + 1.6 * (1 - Math.min(1, Math.max(0, (pitch - 21) / 87)));
      env.gain.setValueAtTime(0, when);
      env.gain.linearRampToValueAtTime(Math.pow(n.v / 127, 1.4) * 0.3, when + 0.006);
      env.gain.setTargetAtTime(0, when + 0.006, ring);
      env.gain.setTargetAtTime(0, when + held, 0.07);
      tail = 0.5;
    }
    src.connect(env); env.connect(this.out);
    src.start(when); src.stop(when + held + tail);
  },
  pause() {
    if (!this.playing) return this.state();
    clearInterval(this.timer); this.timer = null;
    this.pos = Math.max(0, this.ctx.currentTime - this.t0);
    const old = this.out;
    old.gain.setTargetAtTime(0, this.ctx.currentTime, 0.03);
    setTimeout(() => old.disconnect(), 300);
    this.playing = false; this.tell(); follow.stop();
    return this.state();
  },
  toggle() { return this.playing ? this.pause() : this.play(); },
  state() {
    return { playing: this.playing, audio: this.ctx ? this.ctx.state : "none", pos: this.pos, dur: this.dur,
             piano: this.piano.length };
  }
};

// The playback bar: a red line that glides across the music in time with the player, and keeps
// its line of music on screen. OSMD's cursor tells where every stop of the music is drawn; the
// MIDI's tempo map tells which stop the player has reached.
const follow = {
  stops: [], bar: null, raf: 0, line: null,
  measure() {
    this.stops = []; this.line = null;
    const c = osmd && osmd.cursor;
    if (!c) return;
    c.show(); c.reset();
    const el = c.cursorElement;
    while (el && !c.iterator.EndReached) {
      this.stops.push({ q: c.iterator.currentTimeStamp.RealValue * 4,
                        x: el.offsetLeft + el.offsetWidth / 2, top: el.offsetTop, h: el.offsetHeight });
      c.next();
    }
    c.hide();
    if (this.bar) this.bar.remove();
    this.bar = document.createElement("div");
    this.bar.style.cssText = "position:absolute;left:0;top:0;width:3px;margin-left:-1.5px;border-radius:2px;" +
      "background:rgba(224,49,49,.85);pointer-events:none;display:none;z-index:5;will-change:transform";
    if (el && el.parentElement) el.parentElement.appendChild(this.bar);
  },
  // Put the bar where the music is at `t` seconds; `scroll` brings a new line of music into view.
  place(t, scroll) {
    const S = this.stops;
    if (!S.length || !this.bar || !player.quarterAt || (t <= 0 && !player.playing)) return;
    const q = player.quarterAt(t);
    let lo = 0, hi = S.length - 1;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (S[m].q <= q) lo = m; else hi = m - 1; }
    const a = S[lo], b = S[lo + 1];
    let x = a.x;
    if (b && b.top === a.top && b.q > a.q) x += (b.x - a.x) * Math.min(1, Math.max(0, (q - a.q) / (b.q - a.q)));
    this.bar.style.height = a.h + "px";
    this.bar.style.transform = "translate(" + x + "px," + a.top + "px)";
    this.bar.style.display = "block";
    if (scroll && this.line !== a.top) {
      this.line = a.top;
      const r = this.bar.getBoundingClientRect();
      // Keep the playing line in the upper part of the screen, with the next line visible below it.
      const want = Math.max(12, (innerHeight - r.height) * 0.22);
      if (Math.abs(r.top - want) > 8) scrollBy({ top: r.top - want, behavior: "smooth" });
    }
  },
  start() {
    this.line = null;
    cancelAnimationFrame(this.raf);
    const loop = () => { this.place(player.now(), true); this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  },
  stop() { cancelAnimationFrame(this.raf); },
  hide() { if (this.bar) this.bar.style.display = "none"; scrollTo({ top: 0, behavior: "smooth" }); }
};
</script>
</body>
</html>
