<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meowsic">
<!-- black-translucent: the page draws under the status bar (each top bar pads by safe-area-inset-top); "default" let iPadOS 26 lay a white veil over the top of the app -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Meowsic</title>
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/photoimport.css">
<link rel="stylesheet" href="css/completeinfo.css">
<script>try{var t=localStorage.getItem("meowsic-theme")||"light";if(t!=="system")document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="light"}</script>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="print-root" aria-hidden="true"></div>
<script type="module" src="js/app.js"></script>
<script>
  // offline library (needs https or localhost)
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
