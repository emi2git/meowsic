  </g>
  <circle cx="308" cy="362" r="9" fill="#fff"/><circle cx="418" cy="362" r="9" fill="#fff"/>
  <ellipse cx="262" cy="430" rx="26" ry="15" fill="#FF9EB5"/>
  <ellipse cx="448" cy="430" rx="26" ry="15" fill="#FF9EB5"/>
