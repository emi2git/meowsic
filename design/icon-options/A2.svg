  <g fill="#fff" stroke="#2A1442" stroke-width="16" stroke-linejoin="round">
    <path d="M560 180 L560 330" fill="none" stroke="#fff" stroke-width="22"/>
    <path d="M560 180 L660 150 L660 300" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
    <ellipse cx="530" cy="335" rx="42" ry="32" transform="rotate(-20 530 335)" stroke="none"/>
    <ellipse cx="630" cy="305" rx="42" ry="32" transform="rotate(-20 630 305)" stroke="none"/>
