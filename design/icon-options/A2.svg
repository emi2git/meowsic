    <ellipse cx="420" cy="690" rx="66" ry="46"/>
  </g>
  <g stroke="#2A1442" stroke-width="11" stroke-linecap="round">
    <line x1="282" y1="714" x2="282" y2="696"/><line x1="318" y1="714" x2="318" y2="696"/>
    <line x1="402" y1="714" x2="402" y2="696"/><line x1="438" y1="714" x2="438" y2="696"/>
  </g>
