  <path d="M255 290 L250 210 L310 250 Z" fill="#FF9EB5"/>
  <path d="M455 290 L460 210 L400 250 Z" fill="#FF9EB5"/>
  <g stroke="#2A1442" stroke-width="24" fill="#FFC83D">
