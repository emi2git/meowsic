    <path d="M330 690 L330 560 C330 470 420 420 560 420 C720 420 800 490 800 600 L800 690 Z"/>
    <!-- ears -->
    <path d="M240 330 L230 170 L345 245 Z"/>
    <path d="M470 330 L480 170 L365 245 Z"/>
