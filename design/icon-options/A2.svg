  <g stroke="#2A1442" stroke-width="14">
    <line x1="232" y1="692" x2="232" y2="868"/><line x1="344" y1="692" x2="344" y2="868"/>
    <line x1="456" y1="692" x2="456" y2="868"/><line x1="568" y1="692" x2="568" y2="868"/>
    <line x1="680" y1="692" x2="680" y2="868"/><line x1="792" y1="692" x2="792" y2="868"/>
